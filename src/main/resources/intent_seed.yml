# 意图种子配置：L2 向量库的语料
#
# 设计原则：L2 是 L1 的补充，只在 L1 未命中时才被调用。
# 因此 samples 刻意剔除所有能被 L1 正则直接命中的说法（否则永远走不到 L2，纯属冗余），
# 只保留「自然口语、整句、带场景、且不含 L1 触发词」的表达 —— 例如用「坐飞机/起飞」代替
# 「机票/航班」、用「铁路」代替「高铁/火车」、用「住的地方/落脚」代替「酒店/住宿」、
# 用「垫付的钱/单据」代替「报销/发票」。这类说法正是 L1 模板难以命中、需要向量语义兜底的部分。
#
# 写样本时的自检：把它丢给 IntentRuleMatcher，如果 L1 就能命中，这条样本对 L2 毫无价值。
#
# intent 的取值必须和 IntentCategory.code 完全一致，也必须和
# prompt/intent-recognition-agent-system.md 的映射表一致，对不上的会在启动时报错。
#
# keywords 目前没有任何代码读取（L1 已改为代码内正则，见 IntentRuleMatcher），
# 保留是为了记录每个意图的核心词，方便扩规则时对照。

intents:

  # ---------- itineraryManageAgent：差旅申请与审批 ----------

  - intent: travel_application
    keywords:
      - [出差, 申请]
      - [差旅, 申请]
      - [出差, 审批]
      - [我要出差]
    samples:
      - 下周得去客户现场驻场几天，帮我在系统里走一下流程
      - 月底要去参加行业展会，帮我登记一下这趟公务
      - 老板让我去趟广州对接项目，得先在OA里发起个手续
      - 我打算去总部待三天，帮我提交给领导审一下这趟
      - 这次去见客户是公司派的，帮我把出行手续办了
      - 月底要去杭州开个会，帮我安排一下这趟出差

  - intent: travel_cancel
    keywords:
      - [取消, 出差]
      - [取消, 差旅]
      - [撤回, 申请]
    samples:
      - 这趟去北京的安排作废吧，我不过去了
      - 客户临时鸽了，我那趟公务就别办了
      - 计划有变，帮我把已经交上去的那单停掉
      - 领导说不用去了，之前提的那个先撤下来

  - intent: travel_modify
    keywords:
      - [出差, 改]
      - [差旅, 修改]
      - [修改, 目的地]
    samples:
      - 上次交上去那趟的时间不对，帮我换成周五出发
      - 同行的人换了一位，帮我在那单里更新一下
      - 地点从广州挪到深圳，帮我在系统里对一下
      - 回程想晚一天走，帮我把那趟往后顺延

  - intent: approval_query
    keywords:
      - [审批, 进度]
      - [审批, 到哪]
      - [查, 审批]
    samples:
      - 我交上去那个流程现在走到哪一步了
      - 上周提交的东西领导那边有回音没
      - 我那单还要多久能下来
      - 帮我看看卡在谁那里还没往下走

  - intent: travel_order_query
    keywords:
      - [差旅单, 查]
      - [出差单, 状态]
      - [查, 订单]
    samples:
      - 我这个月都有哪几趟公务，帮我列一下
      - 帮我看看名下还有没有没结束的公务
      - 之前定下来的那几趟，帮我调出来看看
      - 帮我查下之前去上海那次的具体信息

  # ---------- itineraryPlanAgent：行程规划与交通住宿查询 ----------

  - intent: itinerary_planning
    keywords:
      - [规划, 行程]
      - [安排, 行程]
      - [行程, 方案]
    samples:
      - 这次去成都三天，帮我把每天的日程都排明白
      - 去广州见两个客户，帮我把这两天的事情统筹一下
      - 帮我把往返交通和住的地方整体捋成一个计划
      - 这趟怎么排比较顺，帮我通盘想一个方案

  - intent: flight_search
    keywords:
      - [机票, 查]
      - [航班, 查]
      - [机票, 多少钱]
    samples:
      - 明天想飞去上海，有哪些班次可选
      - 后天去深圳，早点起飞的有哪些
      - 从成都回北京，下午几点能飞回去
      - 帮我看看去重庆当天能不能飞过去

  - intent: train_search
    keywords:
      - [火车票, 查]
      - [高铁, 查]
      - [动车, 几点]
    samples:
      - 帮我看看明早去南京的铁路班次
      - 去天津想走铁路，下午有哪些趟
      - 回程想坐铁路，帮我看看晚上有没有合适的

  - intent: hotel_search
    keywords:
      - [酒店, 查]
      - [酒店, 推荐]
      - [住宿, 推荐]
    samples:
      - 这次去上海出差，帮我找个离客户近点的落脚地方
      - 帮我看看公司附近有没有方便过夜的地方
      - 去成都待两晚，帮我订个环境安静点的住处
      - 帮我找个西湖边上方便住的地方

  # ---------- bookingAgent：预订与改签 ----------

  - intent: booking
    keywords:
      - [订, 机票]
      - [订, 酒店]
      - [改签]
      - [退票]
    samples:
      - 刚才那个方案就按它来吧，帮我定了
      - 第二个选择挺好的，帮我敲定下来
      - 这个价格可以，帮我把它确定了
      - 就选前面那个，帮我落实一下

  # ---------- reimbursementAgent：报销 ----------

  - intent: reimbursement
    keywords:
      - [报销]
      - [发票]
      - [报销单, 提交]
    samples:
      - 这趟出差垫付的钱，帮我弄回来
      - 出差花的这些单据，帮我整理好交上去
      - 这几张票据帮我录进系统好把钱要回来
      - 回来之后这些开销怎么找公司结

  # ---------- infoAgent：政策、景点与通用信息 ----------

  - intent: policy_query
    keywords:
      - [差旅, 标准]
      - [出差, 标准]
      - [餐标]
      - [签证]
    samples:
      - 出差住的地方公司一晚最多给批多少
      - 坐车这块公司允许坐到什么档次
      - 出差吃饭公司一天给多少补贴
      - 去国外出差办证件这块公司怎么规定的

  - intent: attractions_query
    keywords:
      - [有什么好玩]
      - [景点, 推荐]
      - [旅游, 攻略]
    samples:
      - 忙完工作想出去转转，这边有什么值得一看的
      - 出差之余，本地有没有适合逛逛的去处
      - 这座城市有哪些不能错过的地方
      - 晚上空下来，附近有啥能溜达的地方吗

  - intent: general_info
    keywords:
      - [天气]
      - [怎么去, 机场]
      - [气温]
    samples:
      - 出差那几天目的地穿厚点还是薄点合适
      - 从机场到市区大概要多久
      - 那边这个季节需不需要带伞
      - 当地最近有没有什么需要注意的通知

  # ---------- masterAgent：寒暄与兜底 ----------

  - intent: greeting
    keywords:
      - [你好]
      - [在吗]
      - [你能做什么]
    samples:
      - 早上好呀，今天也要元气满满哦
      - 哈喽哈喽，好久不见啦
      - 嘿，终于等到你上线了
      - 来啦来啦，今天有点事想麻烦你

  # unknown 也配样本：认出「这句话确实没法归类」本身是有价值的判断，
  # L2 直接判 unknown 就能省掉一次 800ms 的 L3 调用，反正两者都路由到 masterAgent。
  - intent: unknown
    keywords:
      - [帮助]
    samples:
      - 随便问问
      - 这个怎么说
      - 你有哪些功能
      - 帮助
      - 我该怎么用你
