server:
  port: 18080

spring:
  application:
    name: gogo-agent
  web:
    resources:
      # 前端是 frontend/ 下的 Vite 工程，npm run build 后产物在 frontend/dist，
      # 指到这里就能用 http://localhost:18080/ 直接访问打包后的页面。
      # 开发阶段走 npm run dev（5173 端口 + vite proxy），不依赖这条配置。
      # 前四项是 Spring Boot 的默认值，覆盖这个配置时必须带上，否则默认目录会失效
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - file:./frontend/dist/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://rm-bp12mcri2l7712aw2io.mysql.rds.aliyuncs.com:3306/gogo-agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: gogo_agent
    password: Zqw123456

  data:
    redis:
      host: 8.140.195.110
      port: 6379
      password: Zqw123456
      database: 0
      # 连接超时
      timeout: 5000ms
      lettuce:
        pool:
          # 最大连接数
          max-active: 16
          # 最大空闲连接
          max-idle: 8
          # 最小空闲连接
          min-idle: 0
          # 拿不到连接时的最大等待时间，-1ms 表示无限等
          max-wait: -1ms

mybatis-plus:
  # mapper xml 位置
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.quanwei.gogo.agent.entity
  configuration:
    # 下划线字段名自动转驼峰属性名
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线记得关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 全局主键策略：数据库自增
      id-type: auto

# 智能体相关配置
agent:
  prompt:
    # 提示词文件位置。classpath:prompt/ 打进 jar；
    # 本地调 prompt 时改成 file:./prompt/ 并把 cache 关掉，改完文件刷新请求就生效
    location: classpath:prompt/
    cache: true

  # 意图识别的分级阈值。这些值必须上线后看真实数据调，所以全部外置。
  # 关注 chat_message.extra 里的 level 分布：L1/L2 占比越高说明规则和样本覆盖越好；
  # L3 一直居高不下，就该回头补 intent_seed.yml 的关键词或样本了。
  intent:
    seed-location: classpath:intent_seed.yml

    # L0 前置分流：含连词且长度超阈值 -> 判为复合问题，跳过 L1/L2 直接走 L3
    l0:
      enabled: true
      # 只看连词会误伤「北京和上海的机票」这类短句，加长度条件挡掉大部分误伤
      length-threshold: 10

    # L1 关键词分类器，约 1ms，无外部调用
    l1:
      enabled: true
      base-confidence: 0.90

    # L2 向量分类器，约 50ms，启动时把 intent_seed.yml 的样本建成内存索引
    l2:
      enabled: true
      # top1 相似度低于它就放弃，交给 L3
      threshold: 0.85
      # top2 属于别的意图且分差小于它，说明语义上分不开，放弃而不是硬选
      margin: 0.05
      embedding:
        # TODO 填真实密钥。留空则 L2 整级禁用，意图识别由 L1 和 L3 承担，服务照常启动
        api-key:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model-name: text-embedding-v4
        dimensions: 1024
        timeout-seconds: 10
        # 百炼单次最多 25 条
        batch-size: 20

  # 模型分档配置。业务代码只声明档位（ModelTierEnum），模型名和开关全在这里，
  # 换模型、开关思考只改这里，不用重新编译。
  #
  # 每档都是独立完整的一组：api-key / base-url / model-name / stream / enable-thinking
  # 各配各的，档位之间不共享、不继承。所以强模型和快模型可以挂在两个不同的账号、
  # 两个不同的接入地址上，互不影响。
  # base-url 留空走 SDK 内置的百炼地址；用专属工作空间端点时在对应档位填上。
  model:
    # 快模型：改写、分类、抽取这类简单任务
    fast:
      api-key: sk-fast-xxxx
      base-url:
      # 1.2元/百万token，或者用最便宜的 qwen-flash 也够了，0.15元/百万token
      model-name: qwen3.6-flash
      stream: true
      enable-thinking: false

    # 强模型：复杂推理、多步规划才值得用
    strong:
      api-key: sk-strong-xxxx
      base-url:
      # 12元/百万token，或者用最新的 kimi/kimi-k3 20元/百万token
      model-name: qwen3.7-max
      stream: true
      enable-thinking: false

    # 强模型 + 深度思考，模型跟 strong 同一个，只是把开关打开
    strong-thinking:
      api-key: sk-strong-thinking-xxxx
      base-url:
      model-name: qwen3.7-max
      stream: true
      enable-thinking: true

    # 稳定模型：中等档位，日常主力
    stable:
      api-key: sk-stable-xxxx
      base-url:
      # 6元/百万token
      model-name: glm-5.1
      stream: true
      enable-thinking: false

# 注：这里没有 agentscope.* 配置是有意的。
# 模型全部由 ModelConfig 的四个 bean 管理，配置见上面的 agent.model。
# starter 的 OpenAIAutoConfiguration 要求 agentscope.model.provider=openai 才装配
# （该条件没有 matchIfMissing，缺失即不匹配），而且还带 @ConditionalOnMissingBean(Model.class)，
# 所以这里留空它就不会再造一个 Model bean 出来。别为了「补全配置」把 agentscope.model.provider 加回来。

sa-token:
  # Token前端需要携带的请求头
  token-name: Authorization
  # 过期时间
  active-timeout: 2592000
  dynamic-active-timeout: false
  # 是否允许多地登录
  is-concurrent: true
  # 相同用户多次登录是否使用同一token
  is-share: false
  # token格式 随机128位
  token-style: random-128
  # 关闭启动日志
  is-print: false